# Keep-alive ping — prevents the Supabase FREE-tier project from auto-pausing
# (it pauses after ~7 days without activity; a paused DB = the whole platform
# down, discovered the hard way on 2026-08-04).
#
# Hits the public venue endpoint every 6 hours; the API queries Supabase,
# which counts as activity. Retire this when Supabase is upgraded to Pro.
#
# Note: GitHub disables scheduled workflows after ~60 days without repo
# activity — any commit re-enables it. Manual run: Actions tab → Run workflow.
name: keepalive
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

# Least privilege: this job only curls a public URL.
permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Retries, because the two failure modes here are both transient and
      # both harmless: Railway answers 404 for the few seconds it takes a
      # redeploy to swap containers, and a cold Supabase can be slow on the
      # first hit. A single attempt turned a normal deploy into a red X in
      # the Actions tab — and an alert that cries wolf is an alert nobody
      # reads when it finally matters.
      #
      # Endpoint choice: /api/loyalty/venues (the public venue list) instead
      # of one specific venue. It still queries Supabase — which is the whole
      # point — but it cannot 404 because someone disabled or renamed a café.
      - name: Ping API (wakes Supabase)
        run: |
          URL="https://heropadapi-production.up.railway.app/api/loyalty/venues"
          for attempt in 1 2 3 4; do
            CODE=$(curl -sS -m 25 -o /tmp/out.json -w '%{http_code}' "$URL" || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "Attempt $attempt: HTTP 200 — Supabase kept awake ✓"
              head -c 200 /tmp/out.json; echo
              exit 0
            fi
            echo "Attempt $attempt: HTTP $CODE — retrying in 45s (deploy in progress or cold start)"
            sleep 45
          done
          echo "::error::API did not answer 200 after 4 attempts over ~3 minutes — this one is real."
          exit 1
