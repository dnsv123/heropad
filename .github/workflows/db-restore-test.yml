# A backup you have never restored is a hope, not a backup — the db-backup
# workflow says so itself. This workflow makes the restore a monthly FACT:
# it downloads the most recent nightly dump, restores it into a throwaway
# Postgres 17, and asserts the tables and the actual rows are there.
#
# Runs: monthly (1st, 04:23 UTC), on manual dispatch, and once whenever this
# file itself changes (so every edit to the test proves itself immediately).
name: db-restore-test

on:
  schedule:
    - cron: '23 4 1 * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/db-restore-test.yml'

permissions:
  contents: read
  actions: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: restore-test
          POSTGRES_DB: restore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Download the latest successful backup artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow db-backup \
            --status success --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful db-backup run found — nothing to restore."
            exit 1
          fi
          echo "Restoring from db-backup run $RUN_ID"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir backup
          ls -lhR backup

      - name: Restore into the throwaway database
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          # Backups are encrypted (see db-backup.yml); decrypt, then unzip.
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 --decrypt backup/*/heropad-backup-*.sql.gz.gpg | gunzip -c > dump.sql
          wc -c dump.sql
          # A schema-only-public dump still points at things Supabase keeps
          # elsewhere: its roles, auth.users (an FK from solana_wallets),
          # auth.uid() (a policy), uuid_generate_v4() in the extensions schema,
          # and the realtime publication. A vanilla Postgres has none of them,
          # which is why this test never passed; give it empty stand-ins.
          docker run --rm --network host postgres:17 \
            psql "postgresql://postgres:restore-test@localhost:5432/restore_test" -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE anon NOLOGIN" \
            -c "CREATE ROLE authenticated NOLOGIN" \
            -c "CREATE ROLE service_role NOLOGIN" \
            -c "CREATE SCHEMA extensions" \
            -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp" WITH SCHEMA extensions' \
            -c "CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA extensions" \
            -c "CREATE SCHEMA auth" \
            -c "CREATE TABLE auth.users (id uuid PRIMARY KEY)" \
            -c "CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS 'select null::uuid'" \
            -c "CREATE FUNCTION auth.role() RETURNS text LANGUAGE sql STABLE AS 'select null::text'" \
            -c "CREATE FUNCTION auth.jwt() RETURNS jsonb LANGUAGE sql STABLE AS 'select null::jsonb'" \
            -c "CREATE PUBLICATION supabase_realtime"
          # The dump recreates schema public, which a fresh database already has.
          sed -i 's/^CREATE SCHEMA public;$/CREATE SCHEMA IF NOT EXISTS public;/' dump.sql
          docker run --rm --network host -v "$PWD:/w" -w /w postgres:17 \
            psql "postgresql://postgres:restore-test@localhost:5432/restore_test" \
            -v ON_ERROR_STOP=1 -q -f dump.sql > restore.log 2>&1 || {
              # This log is public (public repo): print the kind of error, never
              # the rows it was about. Run locally on the decrypted dump to see more.
              echo "::group::restore error kinds"
              # Object names stay readable; any quoted text that is not a plain
              # identifier (a value, an email) is masked.
              grep -E '^(psql:[^ ]+ )?ERROR:' restore.log | cut -c1-200 \
                | sed -E 's/"[^"]*[^A-Za-z0-9_."][^"]*"/"…"/g; s/'"'"'[^'"'"']*'"'"'/'"'"'…'"'"'/g' \
                | sort | uniq -c | head -20
              echo "::endgroup::"
              echo "::error::Restore FAILED — the nightly backup is not restorable."
              exit 1
            }
          echo "Restore applied cleanly."

      - name: Assert the data is really there
        run: |
          q() {
            docker run --rm --network host postgres:17 \
              psql "postgresql://postgres:restore-test@localhost:5432/restore_test" -tAc "$1"
          }
          TABLES=$(q "select count(*) from information_schema.tables where table_schema='public'")
          IDENT=$(q "select count(*) from public.user_identity")
          STAMPS=$(q "select count(*) from public.stamps")
          VENUES=$(q "select count(*) from public.venues")
          echo "tables=$TABLES · identities=$IDENT · stamps=$STAMPS · venues=$VENUES"
          [ "$TABLES" -ge 15 ] || { echo "::error::Only $TABLES tables restored — expected 15+."; exit 1; }
          [ "$VENUES" -ge 1 ]  || { echo "::error::venues came back empty."; exit 1; }
          [ "$IDENT" -ge 1 ]   || { echo "::error::user_identity came back empty."; exit 1; }
          [ "$STAMPS" -ge 1 ]  || { echo "::error::stamps came back empty."; exit 1; }
          echo "✅ Backup restores cleanly and the data survives the round-trip."
